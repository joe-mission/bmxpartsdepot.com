<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMX Exploded View and Spin Game | BMX Parts Depot</title>
<meta name="description" content="An exploded 3D view of a 20 inch street BMX naming 33 components, plus a fifteen second spin game. Drag to orbit, scroll to zoom.">
<link rel="canonical" href="https://bmxpartsdepot.com/bmx-exploded-view/">

<meta property="og:description" content="An exploded 3D view of a 20 inch street BMX naming 33 components, plus a fifteen second spin game.">
<meta property="og:url" content="https://bmxpartsdepot.com/bmx-exploded-view/">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/assets/analytics.js"></script>
<style>
  :root{
    --paper:#f2f0ec;
    --line:rgba(255,255,255,.14);
    --accent:#c79333;
    --hot:#ff5a3c;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#1a0b3a;
    color:#e8e9ec;
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    overflow:hidden;
  }
  body.bg-light{background:var(--paper);color:#14161a}
  body.bg-none{background:repeating-conic-gradient(#1a1d22 0% 25%, #14171b 0% 50%) 50%/22px 22px}

  /* ------------------------------------------------------------------
     Sunset backdrop. The canvas is alpha:true, so everything below shows
     through behind the bike and nothing here touches the 3D scene.

     Three layers: a vertical sunset ramp, a slitted sun sitting on the
     horizon, and a checkerboard floor laid flat in perspective and scrolled
     toward the viewer. The floor is one element with a rotateX on it rather
     than a painted texture, so it stays sharp at any size and costs nothing
     to animate.
     ------------------------------------------------------------------ */
  .scene-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .scene-bg .sky{
    position:absolute;left:0;right:0;top:0;height:62%;
    background:linear-gradient(180deg,
      #150d3a 0%, #36166a 22%, #7d2280 42%,
      #c0356f 60%, #ee6a45 80%, #ffb347 94%, #ffd98a 100%);
  }
  .scene-bg .sun{
    position:absolute;left:50%;top:62%;width:min(46vh,44vw);aspect-ratio:1;
    transform:translate(-50%,-58%);border-radius:50%;
    background:
      repeating-linear-gradient(180deg,
        transparent 0 6px, #1a0b3a 6px 10px,
        transparent 10px 20px, #1a0b3a 20px 27px,
        transparent 27px 40px, #1a0b3a 40px 52px),
      linear-gradient(180deg,#ffe07a 0%,#ff8a3d 40%,#ec3a82 100%);
    background-blend-mode:normal;
    opacity:.95;
  }
  .scene-bg .horizon{
    position:absolute;left:0;right:0;top:62%;height:2px;
    background:#7ff0ff;box-shadow:0 0 18px 4px rgba(127,240,255,.55);
  }
  .scene-bg .floor{
    position:absolute;left:-60%;right:-60%;top:62%;bottom:-30%;
    transform:perspective(220px) rotateX(62deg);
    transform-origin:50% 0;
    background-image:
      repeating-conic-gradient(#f6f6fa 0% 25%, #120e20 0% 50%);
    background-size:64px 64px;
    animation:floorRun 3.2s linear infinite;
  }
  .scene-bg .haze{
    position:absolute;left:0;right:0;top:62%;height:22%;
    background:linear-gradient(180deg,rgba(255,179,71,.92),rgba(255,179,71,0));
  }
  @keyframes floorRun{from{background-position:0 0}to{background-position:0 64px}}
  @media(prefers-reduced-motion:reduce){.scene-bg .floor{animation:none}}

  #stage{position:fixed;inset:0;z-index:1}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas.dragging{cursor:grabbing}
  canvas.over{cursor:crosshair}

  .mast{position:fixed;top:22px;left:26px;pointer-events:none;transition:opacity .3s}
  .mast h1{
    font-family:"Bricolage Grotesque",Georgia,serif;font-weight:800;
    font-size:clamp(20px,2.4vw,30px);letter-spacing:-.025em;margin:0;line-height:1;
  }
  .mast p{margin:8px 0 0;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.55}

  #label{
    position:fixed;pointer-events:none;z-index:5;transform:translate(14px,-50%);
    opacity:0;transition:opacity .12s ease;white-space:nowrap;
  }
  #label.on{opacity:1}
  #label .dot{position:absolute;left:-14px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--accent)}
  #label .rule{position:absolute;left:-11px;top:50%;width:11px;height:1px;background:var(--accent);opacity:.7}
  #label span{
    display:inline-block;padding:5px 10px 4px;background:var(--accent);color:#151108;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  }

  .panel{
    position:fixed;left:26px;bottom:24px;z-index:6;display:flex;align-items:center;
    gap:22px;flex-wrap:wrap;padding:14px 18px;border:1px solid var(--line);
    background:rgba(13,15,19,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:opacity .3s;
  }
  body.bg-light .panel{background:rgba(255,255,255,.78);border-color:rgba(0,0,0,.14)}
  body.spinning .panel,body.spinning .mast,body.spinning .hint{opacity:0;pointer-events:none}
  .ctl{display:flex;align-items:center;gap:10px}
  .ctl > label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.6}
  input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:1px;background:currentColor;opacity:.45;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}
  .seg{display:flex;border:1px solid var(--line)}
  body.bg-light .seg{border-color:rgba(0,0,0,.16)}
  .seg button{font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;background:none;border:none;color:inherit;opacity:.5;cursor:pointer}
  .seg button[aria-pressed=true]{opacity:1;background:var(--accent);color:#151108}
  .act{font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:7px 13px;background:none;border:1px solid var(--line);color:inherit;cursor:pointer}
  body.bg-light .act{border-color:rgba(0,0,0,.16)}
  .act:hover{background:var(--accent);color:#151108;border-color:var(--accent)}
  /* Added for the site. Lives in the panel so it inherits the rule that hides
     the panel during a spin, and so it cannot be clicked mid-game. */
  a.homelink{text-decoration:none;display:inline-block}
  /* The panel hides during a spin, and spin mode is the landing view, so the
     page needs a second way out that survives it. Bottom right, where the
     hint text sits in diagram mode and nothing sits in spin mode. */
  .spinhome{
    position:fixed;right:26px;bottom:26px;z-index:9;display:none;text-decoration:none;
    color:inherit;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    opacity:.4;transition:opacity .2s;padding:6px 2px;
  }
  body.spinning .spinhome{display:block}
  .spinhome:hover,.spinhome:focus-visible{opacity:1}
  .spinhome:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .act.hot{border-color:var(--hot);color:var(--hot)}
  .act.hot:hover{background:var(--hot);color:#1a0a06;border-color:var(--hot)}
  .seg button:focus-visible,.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .modeswitch{
    position:fixed;top:22px;right:26px;z-index:10;
    background:rgba(13,15,19,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }
  body.bg-light .modeswitch{background:rgba(255,255,255,.8)}

  .gamelogo{position:fixed;top:20px;left:26px;z-index:10;pointer-events:none;display:none}
  body.spinning .gamelogo{display:block}
  .gamelogo .eyebrow{
    display:block;font-size:9.5px;letter-spacing:.34em;
    text-transform:uppercase;opacity:.45;margin-bottom:8px;
  }
  .gamelogo .wordmark{
    display:block;font-family:"Bricolage Grotesque",Georgia,serif;font-weight:800;
    text-transform:uppercase;font-size:clamp(27px,3.5vw,44px);line-height:.80;
    letter-spacing:-.045em;color:var(--accent);
    text-shadow:0 0 30px rgba(199,147,51,.35);
  }
  .gamelogo .wordmark em{
    display:block;font-style:normal;color:var(--hot);
    text-shadow:0 0 30px rgba(255,90,60,.35);
  }

  .hint{
    position:fixed;right:26px;bottom:28px;z-index:6;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;opacity:.4;text-align:right;line-height:1.9;pointer-events:none;transition:opacity .3s;
  }

  /* ---------- spin mode ---------- */

  /* The backdrop is bright now, and the HUD was designed against a near-black
     page. Rather than recolour every readout, the floating text gets a shadow,
     which holds up over the sun, the checkerboard and the sky alike. The
     panels and buttons already carry their own backgrounds and are left
     alone. */
  #spinUI,.gamelogo,#prompt,#cheat{
    text-shadow:0 2px 14px rgba(10,6,24,.92),0 0 3px rgba(10,6,24,.8);
  }
  #spinUI{position:fixed;inset:0;z-index:8;pointer-events:none;display:none}
  body.spinning #spinUI{display:block}
  #score{position:absolute;top:5vh;left:0;right:0;text-align:center;font-family:"Bricolage Grotesque",Georgia,serif}
  #score .n{
    display:block;font-size:clamp(74px,17vw,190px);line-height:.85;font-weight:800;
    letter-spacing:-.05em;color:var(--accent);text-shadow:0 0 44px rgba(199,147,51,.42);
    transition:transform .09s cubic-bezier(.2,1.7,.4,1);transform-origin:50% 60%;
  }
  #score .n.pop{transform:scale(1.22)}
  #score .n.hotstreak{color:var(--hot);text-shadow:0 0 54px rgba(255,90,60,.5)}
  #score .cap{
    display:block;margin-top:12px;font-family:"IBM Plex Mono",monospace;
    font-size:11px;letter-spacing:.42em;text-transform:uppercase;opacity:.62;
  }
  #score .clock{
    display:block;margin-top:18px;font-family:"IBM Plex Mono",monospace;
    font-size:15px;font-weight:500;letter-spacing:.24em;opacity:.45;
    font-variant-numeric:tabular-nums;transition:color .2s,opacity .2s;
  }
  #score .clock.low{color:var(--hot);opacity:1}
  #prompt{
    position:absolute;bottom:13vh;left:0;right:0;text-align:center;
    font-size:12px;letter-spacing:.3em;text-transform:uppercase;
    animation:pulse 1.9s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.28}50%{opacity:.85}}
  #prompt.gone{display:none}
  .float{
    position:absolute;font-family:"Bricolage Grotesque",Georgia,serif;font-weight:800;
    font-size:30px;color:var(--accent);pointer-events:none;animation:floatup .85s ease-out forwards;
  }
  @keyframes floatup{
    from{opacity:1;transform:translate(-50%,0) scale(1)}
    to{opacity:0;transform:translate(-50%,-86px) scale(1.45)}
  }
  /* Was centred at bottom:22vh, which sat squarely on the bike with a ten
     percent tint, so it read through the frame. Top right under the mode
     button is the one part of the screen the bike never reaches. Opaque, so
     it stays legible whatever is behind it. */
  #cheat{
    position:absolute;top:72px;right:26px;transform:translateY(-8px);
    max-width:260px;padding:12px 16px;border:1px solid var(--hot);
    background:rgba(20,8,5,.92);
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;text-align:right;
    opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;
  }
  #cheat.on{opacity:1;transform:translateY(0)}
  #cheat b{
    display:block;margin-bottom:7px;color:var(--hot);font-weight:600;letter-spacing:.3em;
  }
  #endcard{
    position:absolute;inset:0;display:none;place-items:center;pointer-events:auto;
    background:rgba(8,9,12,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  #endcard.on{display:grid;animation:fadein .25s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .card{text-align:center;padding:0 24px;max-width:640px}
  .card .bang{
    font-family:"Bricolage Grotesque",Georgia,serif;font-weight:800;
    font-size:clamp(52px,11vw,120px);line-height:.9;letter-spacing:-.045em;
    color:var(--hot);margin:0;text-shadow:0 0 60px rgba(255,90,60,.4);
    animation:slam .4s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes slam{from{transform:scale(1.7);opacity:0}to{transform:scale(1);opacity:1}}
  .card .line{
    margin:22px 0 0;font-size:clamp(13px,1.6vw,17px);letter-spacing:.13em;
    text-transform:uppercase;color:#e8e9ec;line-height:1.85;
  }
  .card .line b{color:var(--accent);font-weight:600}
  .card .rank{margin:8px 0 0;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;opacity:.5}
  .card .btns{margin-top:34px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .card .act{padding:11px 20px;font-size:11px}
  #sndBtn{position:absolute;bottom:24px;left:26px;pointer-events:auto}

  @media (max-width:720px){
    .panel{left:14px;right:14px;bottom:14px;gap:14px;padding:12px}
    input[type=range]{width:100px}
    .hint{display:none}
    .mast{top:14px;left:16px}
    .modeswitch{top:14px;right:14px}
    .gamelogo{top:13px;left:16px}
    #score{top:15vh}
    #sndBtn{bottom:14px;left:14px}
  }
  #loading{position:fixed;inset:0;display:grid;place-items:center;z-index:9;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
</style>
</head>
<body>
<div class="scene-bg" aria-hidden="true">
  <div class="sky"></div>
  <div class="sun"></div>
  <div class="floor"></div>
  <div class="haze"></div>
  <div class="horizon"></div>
</div>
<div id="stage"><div id="loading">Assembling</div></div>

<div class="gamelogo" id="gameLogo">
  <span class="eyebrow">20&Prime; street</span>
  <span class="wordmark">Spin<em>Game</em></span>
</div>

<button class="act modeswitch" id="modeSwitch">Exploded view</button>

<div class="mast">
  <h1>Exploded view</h1>
  <p><span id="pcount">33</span> components &middot; 20&Prime; street complete</p>
</div>

<div id="label"><i class="rule"></i><i class="dot"></i><span></span></div>

<div class="panel">
  <div class="ctl">
    <label for="explode">Explode</label>
    <input id="explode" type="range" min="0" max="100" value="55" aria-label="Explode amount">
  </div>
  <a class="act homelink" href="/#games">Back to BMX Parts Depot</a>
</div>

<div class="hint">Drag to orbit<br>Scroll to zoom</div>

<a class="spinhome" href="/#games">Back to BMX Parts Depot</a>

<div id="spinUI">
  <button class="act" id="sndBtn" aria-pressed="true">Sound on</button>
  <div id="score"><span class="n" id="scoreN">0</span><span class="cap">Rotations</span><span class="clock" id="clock">15.0</span></div>
  <div id="prompt">Click and drag fast to spin it</div>
  <div id="cheat"><b>Cheat code</b>Hold the left or right arrow key</div>
  <div id="endcard">
    <div class="card">
      <p class="bang" id="bang">WOW!</p>
      <p class="line" id="endline"></p>
      <p class="rank" id="rank"></p>
      <div class="btns">
        <button class="act hot" id="again">Spin again</button>
        <button class="act" id="backToDiagram">Back to the diagram</button>
      </div>
    </div>
  </div>
</div>

<script src="/assets/vendor/three.r128.min.js"></script>
<script>
(function(){
"use strict";

/* ------------------------------------------------------------------
   PALETTE - change these to match your site. FRAME is the main color.
------------------------------------------------------------------ */
var PALETTE = {
  FRAME:   0x1b4cc4,
  CHROME:  0xdfe3e8,
  BLACK:   0x1b1d22,
  GOLD:    0xc79333,
  RUBBER:  0x141519,
  SIDEWALL:0x26282e,
  RIM:     0xc9ced6,
  SEAT:    0x2b1d15,
  TUBE:    0x2a2b30
};

var T = window.THREE;
var stage = document.getElementById('stage');
var labelEl = document.getElementById('label');
var labelText = labelEl.querySelector('span');
var loading = document.getElementById('loading');
var explodeSlider = document.getElementById('explode');
var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- renderer ---------- */
var renderer = new T.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);
var canvas = renderer.domElement;

var scene = new T.Scene();
var camera = new T.PerspectiveCamera(34, window.innerWidth/window.innerHeight, 1, 600);

var explodeT = 0;   // opens on the spin game, so it starts built
var TARGET = new T.Vector3(5, 23, 0);
var orbit = { az:-0.62, pol:1.30, dist:92 };
var zoom = 1;

function placeCamera(){
  var s = Math.sin(orbit.pol), c = Math.cos(orbit.pol);
  camera.position.set(
    TARGET.x + orbit.dist * s * Math.sin(orbit.az),
    TARGET.y + orbit.dist * c,
    TARGET.z + orbit.dist * s * Math.cos(orbit.az)
  );
  camera.lookAt(TARGET);
}
function fitCamera(){
  var radius = 23 + 16 * explodeT;
  var tv = Math.tan(camera.fov * Math.PI / 360);
  var th = tv * camera.aspect;
  orbit.dist = Math.max(24, Math.min(240, (radius / Math.min(tv, th)) * 1.06 * zoom));
  placeCamera();
}

/* ---------- environment ---------- */
function buildEnv(){
  var size = 64, faces = [], i;
  for (i=0;i<6;i++){
    var cv = document.createElement('canvas');
    cv.width = cv.height = size;
    var ctx = cv.getContext('2d');
    if (i === 2){ ctx.fillStyle = '#ffffff'; }
    else if (i === 3){ ctx.fillStyle = '#41464f'; }
    else {
      var g = ctx.createLinearGradient(0,0,0,size);
      g.addColorStop(0,'#d5dbe6'); g.addColorStop(0.55,'#878e9b'); g.addColorStop(1,'#41464f');
      ctx.fillStyle = g;
    }
    ctx.fillRect(0,0,size,size);
    faces.push(cv);
  }
  var cube = new T.CubeTexture(faces);
  cube.needsUpdate = true;
  cube.encoding = T.sRGBEncoding;
  var pm = new T.PMREMGenerator(renderer);
  pm.compileCubemapShader();
  var env = pm.fromCubemap(cube).texture;
  pm.dispose();
  return env;
}
scene.environment = buildEnv();

scene.add(new T.HemisphereLight(0xdfe7f5, 0x2b2f36, 0.55));
var key = new T.DirectionalLight(0xffffff, 1.55); key.position.set(-30,46,40); scene.add(key);
var fill = new T.DirectionalLight(0xbcd0ef, 0.6); fill.position.set(40,14,-30); scene.add(fill);
var rimL = new T.DirectionalLight(0xffd9a0, 0.5); rimL.position.set(10,-22,-34); scene.add(rimL);

/* ---------- materials ---------- */
function mk(color, metal, rough){
  return new T.MeshStandardMaterial({color:color, metalness:metal, roughness:rough});
}
var M = {
  frame:  function(){ return mk(PALETTE.FRAME, 0.55, 0.26); },
  chrome: function(){ return mk(PALETTE.CHROME, 0.96, 0.13); },
  black:  function(){ return mk(PALETTE.BLACK, 0.62, 0.34); },
  gold:   function(){ return mk(PALETTE.GOLD, 0.92, 0.22); },
  rubber: function(){ return mk(PALETTE.RUBBER, 0.02, 0.86); },
  side:   function(){ return mk(PALETTE.SIDEWALL, 0.05, 0.72); },
  inner:  function(){ return mk(PALETTE.TUBE, 0.03, 0.55); },
  rim:    function(){ return mk(PALETTE.RIM, 0.90, 0.17); },
  seat:   function(){ return mk(PALETTE.SEAT, 0.10, 0.62); },
  grip:   function(){ return mk(0x1e2026, 0.05, 0.66); }
};

/* ---------- helpers ---------- */
var UP = new T.Vector3(0,1,0);
var ZAX = new T.Vector3(0,0,1);
function V(x,y,z){ return new T.Vector3(x,y,z===undefined?0:z); }

function tube(a,b,r,material,seg){
  var d = new T.Vector3().subVectors(b,a), len = d.length();
  var m = new T.Mesh(new T.CylinderGeometry(r,r,len,seg||24,1,false), material);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP, d.normalize());
  return m;
}
function disc(center,axis,r,thick,material,seg){
  var m = new T.Mesh(new T.CylinderGeometry(r,r,thick,seg||40), material);
  m.position.copy(center);
  m.quaternion.setFromUnitVectors(UP, axis.clone().normalize());
  return m;
}
function ring(center,axis,r,t,material,seg){
  var m = new T.Mesh(new T.TorusGeometry(r,t,16,seg||60), material);
  m.position.copy(center);
  m.quaternion.setFromUnitVectors(ZAX, axis.clone().normalize());
  return m;
}
function box(center,w,h,d,material){
  var m = new T.Mesh(new T.BoxGeometry(w,h,d), material);
  m.position.copy(center);
  return m;
}
function curveTube(points,r,material,closed,seg){
  var c = new T.CatmullRomCurve3(points, !!closed, 'catmullrom', 0.5);
  return new T.Mesh(new T.TubeGeometry(c, seg||140, r, 14, !!closed), material);
}
function bolt(center, axis, r, len, material){
  var g = new T.Group();
  var ax = axis.clone().normalize();
  g.add(disc(center, ax, r, len, material, 6));
  g.add(disc(center.clone().addScaledVector(ax, len*0.55), ax, r*0.7, len*0.3, material, 12));
  return g;
}

/* ---------- part registry ---------- */
var PARTS = [];
function part(name, offset, build){
  var g = new T.Group();
  build(g);
  g.traverse(function(o){
    if (o.isMesh){
      o.material = o.material.clone();
      o.userData.baseEmissive = o.material.emissive.getHex();
    }
  });
  g.userData.partName = name;
  g.userData.offset = offset;
  scene.add(g);
  PARTS.push(g);
  return g;
}

var TIRE_R = 8.55, TIRE_T = 1.15, RIM_R = 7.55;

/* ---------- wheel builders ---------- */
function tireGroup(g, c){
  g.add(ring(c, ZAX, TIRE_R, TIRE_T, M.rubber()));
  g.add(ring(c, ZAX, TIRE_R - 0.06, TIRE_T - 0.22, M.side()));
  var tread = M.rubber();
  for (var i=0;i<44;i++){
    var a = i/44*Math.PI*2, rr = TIRE_R + TIRE_T*0.72;
    var b = box(V(c.x+Math.cos(a)*rr, c.y+Math.sin(a)*rr, c.z), 0.62, 0.62, 2.05, tread);
    b.rotation.z = a;
    g.add(b);
  }
}
function innerTubeGroup(g, c){
  g.add(ring(c, ZAX, TIRE_R - 0.35, TIRE_T - 0.42, M.inner(), 48));
  var v = V(c.x, c.y - (TIRE_R - 0.35) - 0.35, c.z);
  g.add(tube(v, V(v.x, v.y - 1.30, v.z), 0.17, M.chrome(), 12));
}
function rimGroup(g, c){
  var p = [
    new T.Vector2(RIM_R-1.05,-0.95), new T.Vector2(RIM_R-0.15,-0.95),
    new T.Vector2(RIM_R+0.05,-0.62), new T.Vector2(RIM_R+0.05, 0.62),
    new T.Vector2(RIM_R-0.15, 0.95), new T.Vector2(RIM_R-1.05, 0.95)
  ];
  var m = new T.Mesh(new T.LatheGeometry(p, 64), new T.MeshStandardMaterial({
    color:PALETTE.RIM, metalness:0.9, roughness:0.17, side:T.DoubleSide
  }));
  m.position.copy(c); m.rotation.x = Math.PI/2;
  g.add(m);
}
function spokeGroup(g, c){
  var s = M.chrome();
  for (var i=0;i<32;i++){
    var a = i/32*Math.PI*2, side = (i%2)?1.13:-1.13, lace = (i%2)?0.30:-0.30;
    g.add(tube(
      V(c.x+Math.cos(a)*1.06, c.y+Math.sin(a)*1.06, c.z+side),
      V(c.x+Math.cos(a+lace)*(RIM_R-0.95), c.y+Math.sin(a+lace)*(RIM_R-0.95), c.z),
      0.055, s, 6));
  }
}
function hubGroup(g, c, driver){
  var ch = M.chrome(), bl = M.black();
  // slim shell between the flanges - a hub barrel is narrower than its flanges
  g.add(tube(V(c.x,c.y,c.z-1.14), V(c.x,c.y,c.z+1.14), 0.58, bl, 26));
  [-1,1].forEach(function(sd){
    // spoke flange
    g.add(disc(V(c.x,c.y,c.z+1.16*sd), ZAX, 1.06, 0.20, ch, 34));
    // bearing housing tapering out to the axle
    var m = new T.Mesh(new T.CylinderGeometry(0.34, 0.56, 0.78, 22), bl);
    m.position.set(c.x, c.y, c.z + 1.66*sd);
    m.quaternion.setFromUnitVectors(UP, V(0,0,sd));
    g.add(m);
    g.add(disc(V(c.x,c.y,c.z+2.12*sd), ZAX, 0.37, 0.20, ch, 22));
  });
  g.add(tube(V(c.x,c.y,c.z-3.05), V(c.x,c.y,c.z+3.05), 0.27, ch, 18));
  if (driver){
    var go = M.gold();
    g.add(disc(V(c.x,c.y,c.z+2.40), ZAX, 0.78, 0.42, go, 30));
    for (var i=0;i<9;i++){
      var a = i/9*Math.PI*2;
      var t = box(V(c.x+Math.cos(a)*0.94, c.y+Math.sin(a)*0.94, c.z+2.40), 0.26, 0.26, 0.36, go);
      t.rotation.z = a; g.add(t);
    }
  }
}
function nutGroup(g, c){
  var go = M.gold();
  [-3.18,3.18].forEach(function(z){ g.add(disc(V(c.x,c.y,c.z+z), ZAX, 0.44, 0.40, go, 6)); });
}

part('Sprocket', V(0,0,13.5), function(g){
  // 25t on 1/2in pitch = about a 4in pitch circle, so radius ~2.0
  var go = M.gold(), PR = 2.00, i, a;

  // outer ring, lathed so it has real thickness rather than a flat plate
  var prof = [

    color:PALETTE.GOLD, metalness:0.92, roughness:0.22, side:T.DoubleSide
  }));
  rm.rotation.x = Math.PI/2;
  rm.position.set(0, 11.7, 2.40);
  g.add(rm);

  // small teeth on the pitch circle
  for (i=0;i<25;i++){
    a = i/25*Math.PI*2;
    var t = box(V(Math.cos(a)*(PR+0.19), 11.7+Math.sin(a)*(PR+0.19), 2.40), 0.29, 0.29, 0.20, go);
    t.rotation.z = a; g.add(t);
  }

  // centre boss and five spider arms
  g.add(disc(V(0,11.7,2.40), ZAX, 0.74, 0.26, go, 30));
  for (i=0;i<5;i++){
    a = i/5*Math.PI*2;
    var arm = box(V(Math.cos(a)*1.14, 11.7+Math.sin(a)*1.14, 2.40), 1.34, 0.40, 0.20, go);
    arm.rotation.z = a; g.add(arm);
  }
});
part('Chain', V(0,-7.0,6.0), function(g){
  var c1 = V(0,11.7), r1 = 2.13, c2 = REAR_AX, r2 = 0.96;
  var d = Math.hypot(c2.x-c1.x, c2.y-c1.y);
  var alpha = Math.atan2(c2.y-c1.y, c2.x-c1.x);
  var beta = Math.acos((r1-r2)/d);
  var pts = [], i, a;
  for (i=0;i<=26;i++){
    a = (alpha+beta) + (2*Math.PI-2*beta)*(i/26);
    pts.push(V(c1.x+Math.cos(a)*r1, c1.y+Math.sin(a)*r1, 2.40));
  }
  for (i=0;i<=14;i++){
    a = (alpha-beta) + (2*beta)*(i/14);
    pts.push(V(c2.x+Math.cos(a)*r2, c2.y+Math.sin(a)*r2, 2.40));
  }
  g.add(curveTube(pts, 0.26, M.black(), true, 260));
});

});
part('Brake pads', V(-7.0,7.5,0), function(g){
  var b = M.black();
  [-1,1].forEach(function(s){
    // 48 degrees round the rim, long axis tangent to the braking surface
    var p = box(V(-8.515,15.536,1.06*s), 1.85, 0.62, 0.50, b);
    p.rotation.z = 2.409; g.add(p);
    g.add(tube(V(-8.515,15.536,1.06*s), V(-8.515,15.536,1.42*s), 0.16, M.chrome(), 12));
  });
});
part('Cable hanger', V(-2.2,4.4,0), function(g){
  var go = M.gold(), c = M.chrome();
  g.add(box(V(-8.30,21.45,0), 1.35, 0.50, 1.7, go));
  g.add(tube(V(-8.30,21.22,0), V(-8.30,20.86,0), 0.14, c, 10));
  [-1,1].forEach(function(s){
    g.add(tube(V(-8.30,20.86,0), V(-8.30,20.30,1.20*s), 0.09, c, 8));
  });
});
part('Brake cable', V(0,4.0,6.0), function(g){
  var ch = M.chrome(), go = M.gold();
  // The run under the saddle. The seat pad spans x 1.52 to -8.18 with its
  // underside at about y 22.75, and the old path crossed that span at y 22.80,
  // five hundredths of a unit above it, which read as the cable passing
  // through the seat. It now drops clear before the seat's front edge and
  // runs along at y 21.3 to 21.9, out at z 1.5 to clear the seat post as well.
  var path = [
    V(18.62,38.32,8.32), V(18.95,39.55,6.55), V(17.15,39.85,4.35),
    V(13.00,36.55,2.30), V( 6.00,30.60,1.30), V( 3.60,26.90,1.50),
    V( 2.05,23.45,1.66), V( 0.00,21.90,1.70), V(-3.40,21.35,1.55),
    V(-6.30,21.32,0.92), V(-7.55,21.66,0.34), V(-8.30,21.92,0.00)
  ];
  g.add(curveTube(path, 0.185, M.black(), false, 150));
  // ferrule where the housing leaves the lever
  g.add(tube(V(18.55,38.20,8.45), V(18.78,38.92,7.55), 0.30, ch, 16));
  // barrel adjuster part way along the run
  g.add(tube(V(16.20,39.05,3.60), V(14.70,37.75,2.95), 0.32, go, 18));
  // ferrule at the hanger, then bare inner wire down to the straddle
  g.add(tube(V(-7.62,21.68,0.31), V(-8.26,21.90,0.02), 0.29, ch, 16));
  g.add(tube(V(-8.30,21.92,0.00), V(-8.30,21.60,0.00), 0.085, ch, 10));
});

/* the brake comes off for the spin game - nobody's running brakes */
var BRAKE_PARTS = {
  'Brake cable':1, 'Cable hanger':1, 'Brake arms':1, 'Brake pads':1,
  'Springs':1, 'Brake mount':1, 'Lever':1
};
function setBrakesVisible(on){
  for (var i=0;i<PARTS.length;i++){
    if (BRAKE_PARTS[PARTS[i].userData.partName]) PARTS[i].visible = on;
  }
}

/* ---------- explode ---------- */
function applyExplode(t){
  for (var i=0;i<PARTS.length;i++){
    PARTS[i].position.copy(PARTS[i].userData.offset).multiplyScalar(t);
  }
}
applyExplode(explodeT);
fitCamera();

(function(){
  var seen = {}, n = 0;
  for (var i=0;i<PARTS.length;i++){
    var nm = PARTS[i].userData.partName;
    if (!seen[nm]){ seen[nm] = 1; n++; }
  }
  document.getElementById('pcount').textContent = n;
})();

/* ---------- interaction ---------- */
var ray = new T.Raycaster();
var mouse = new T.Vector2(-10,-10);
var hovered = null;
var dragging = false, lastX = 0, lastY = 0, idleAt = performance.now();

function setHover(group){
  if (hovered === group) return;
  if (hovered){
    hovered.traverse(function(o){ if (o.isMesh) o.material.emissive.setHex(o.userData.baseEmissive); });
  }
  hovered = group;
  if (hovered){
    hovered.traverse(function(o){ if (o.isMesh) o.material.emissive.setHex(0x6a4d0d); });
    labelText.textContent = hovered.userData.partName;
    labelEl.classList.add('on');
    canvas.classList.add('over');
  } else {
    labelEl.classList.remove('on');
    canvas.classList.remove('over');
  }
}

canvas.addEventListener('pointerdown', function(e){
  if (spin.active) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup', function(){
  dragging = false; idleAt = performance.now();
  canvas.classList.remove('dragging');
});
canvas.addEventListener('pointerleave', function(){ setHover(null); mouse.set(-10,-10); });

canvas.addEventListener('wheel', function(e){
  if (spin.active) return;
  e.preventDefault();
  zoom = Math.max(0.42, Math.min(2.4, zoom + e.deltaY*0.0011));
  fitCamera();
}, {passive:false});

explodeSlider.addEventListener('input', function(){
  if (spin.active) return;
  explodeT = this.value/100;
  applyExplode(explodeT);
  fitCamera();
});

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  fitCamera();
});

/* ==================================================================
   SPIN MODE - swing the mouse in circles, it counts the rotations
================================================================== */
var spin = {
  active:false, vel:0, count:0, azAccum:0, last:null,
  lastInputAt:0, ended:false, sound:true, best:0,
  px:0, py:0, held:false, cheatShown:false, lastBlip:0, startAt:null
};
var MAX_VEL = 70;

/* GA4 hooks - no-ops when analytics.js is absent or unconfigured */
function track(name, params){ if (window.gtag) gtag('event', name, params || {}); }
function spinStarted(t){
  if (spin.startAt !== null) return;
  spin.startAt = t;
  track('game_start', { game_name: 'spin_game' });
}
var isTouch = window.matchMedia('(hover: none), (pointer: coarse)').matches;
var SPIN_LIMIT = 15000;   // hard stop, however hard they lean on it
var scoreN = document.getElementById('scoreN');
var promptEl = document.getElementById('prompt');
var endcard = document.getElementById('endcard');
var spinUI = document.getElementById('spinUI');
var cheatEl = document.getElementById('cheat');
var clockEl = document.getElementById('clock');

// the cheat depends on what the device actually has
cheatEl.innerHTML = '<b>Cheat code</b>' +
  (isTouch ? 'Tap anywhere as fast as you can' : 'Hold the left or right arrow key');
promptEl.textContent = isTouch ? 'Swipe fast to spin it' : 'Click and drag fast to spin it';
var audioCtx = null;

function blip(n){
  if (!spin.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    /* Safari starts a context suspended unless it was created inside a user
       gesture. Without this the game is silent there, permanently. */
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator(), gn = audioCtx.createGain();
    o.type = 'square';
    o.frequency.value = Math.min(1180, 300 + n*26);
    gn.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.055, audioCtx.currentTime + 0.008);
    gn.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.11);
    o.connect(gn); gn.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.12);
  } catch(err){ /* audio is a nicety, never a blocker */ }
}
function fanfare(){
  if (!spin.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    /* Safari starts a context suspended unless it was created inside a user
       gesture. Without this the game is silent there, permanently. */
    if (audioCtx.state === 'suspended') audioCtx.resume();
    [523,659,784,1047].forEach(function(f,i){
      var o = audioCtx.createOscillator(), gn = audioCtx.createGain();
      var t0 = audioCtx.currentTime + i*0.085;
      o.type = 'triangle'; o.frequency.value = f;
      gn.gain.setValueAtTime(0.0001, t0);
      gn.gain.exponentialRampToValueAtTime(0.09, t0+0.01);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0+0.30);
      o.connect(gn); gn.connect(audioCtx.destination);
      o.start(t0); o.stop(t0+0.32);
    });
  } catch(err){ /* no-op */ }
}
function floatPlus(x,y){
  var d = document.createElement('div');
  d.className = 'float';
  d.textContent = '+1';
  d.style.left = x + 'px';
  d.style.top = (y - 30) + 'px';
  spinUI.appendChild(d);
  setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 900);
}
function registerRotation(){
  spin.count++;
  var now = performance.now();
  scoreN.textContent = spin.count;
  scoreN.classList.remove('pop');
  void scoreN.offsetWidth;
  scoreN.classList.add('pop');
  if (spin.count >= 12) scoreN.classList.add('hotstreak');
  promptEl.classList.add('gone');
  if (now - spin.lastBlip > 55){
    floatPlus(spin.px, spin.py);
    blip(spin.count);
    spin.lastBlip = now;
  }
  if (!spin.cheatShown && spin.count >= 3) showCheat();
}
function showCheat(){
  spin.cheatShown = true;
  cheatEl.classList.add('on');
  setTimeout(function(){ cheatEl.classList.remove('on'); }, 6000);
}
function enterSpin(){
  spin.active = true; spin.vel = 0; spin.count = 0; spin.azAccum = 0;
  spin.last = null; spin.ended = false; spin.lastInputAt = performance.now();
  spin.held = false; spin.cheatShown = false; spin.lastBlip = 0;
  spin.px = window.innerWidth/2; spin.py = window.innerHeight/2;
  setBrakesVisible(false);
  spin.startAt = null;
  clockEl.textContent = (SPIN_LIMIT/1000).toFixed(1);
  clockEl.classList.remove('low');
  cheatEl.classList.remove('on');
  scoreN.textContent = '0';
  scoreN.classList.remove('hotstreak');
  promptEl.classList.remove('gone');
  endcard.classList.remove('on');
  document.body.classList.add('spinning');
  setHover(null);
  dragging = false;
  zoom = 0.94;
}
function exitSpin(){
  spin.active = false; spin.ended = false;
  setBrakesVisible(true);
  document.body.classList.remove('spinning');
  endcard.classList.remove('on');
  zoom = 1;
  idleAt = performance.now();
}
function endSpin(){
  spin.ended = true;
  spin.vel = 0;
  track('post_score', { score: spin.count, game_name: 'spin_game' });
  clockEl.textContent = '0.0';
  cheatEl.classList.remove('on');
  if (spin.count > spin.best) spin.best = spin.count;
  var bang = 'NICE.', rank = 'Warming up';
  if (spin.count >= 5)  { bang = 'WOW!';        rank = 'Solid revolutions'; }
  if (spin.count >= 15) { bang = 'INCREDIBLE!'; rank = 'Dialed'; }
  if (spin.count >= 30) { bang = 'UNREAL!';     rank = 'Certified spin doctor'; }
  document.getElementById('bang').textContent = bang;
  document.getElementById('endline').innerHTML =
    'Great job. You spun it <b>' + spin.count + '</b> time' + (spin.count === 1 ? '' : 's') + '.';
  document.getElementById('rank').textContent =
    rank + (spin.best > spin.count ? ' \u00b7 Best ' + spin.best : '');
  endcard.classList.add('on');
  fanfare();
}

var lastTap = 0;
window.addEventListener('pointerdown', function(){
  if (!spin.active) return;
  spin.held = true;
  if (spin.ended || !isTouch) return;

  // touch cheat: the faster the taps land, the harder each one shoves
  var now = performance.now(), gap = now - lastTap;
  lastTap = now;
  var boost = 5.5;
  if (gap < 320) boost += (320 - gap) / 320 * 5.5;
  spin.vel += (spin.vel >= 0 ? boost : -boost);
  spin.lastInputAt = now;
  spinStarted(now);
  if (!spin.cheatShown) showCheat();
});
window.addEventListener('pointerup',   function(){ spin.held = false; });
window.addEventListener('keydown', function(e){
  if (!spin.active || spin.ended) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    e.preventDefault();
    spin.vel += (e.key === 'ArrowRight' ? 6.5 : -6.5);
    spin.lastInputAt = performance.now();
    spinStarted(spin.lastInputAt);
    if (!spin.cheatShown) showCheat();
  }
});

var modeSwitch = document.getElementById('modeSwitch');
var mode = 'spin';
function setMode(m){
  track('select_content', { content_type: 'game_mode', content_id: m });
  mode = m;
  modeSwitch.textContent = (m === 'spin') ? 'Exploded view' : 'Spin game';
  if (m === 'spin') enterSpin(); else exitSpin();
}
modeSwitch.addEventListener('click', function(){
  setMode(mode === 'spin' ? 'view' : 'spin');
});
document.getElementById('again').addEventListener('click', function(){ setMode('spin'); });
document.getElementById('backToDiagram').addEventListener('click', function(){ setMode('view'); });
document.getElementById('sndBtn').addEventListener('click', function(){
  spin.sound = !spin.sound;
  this.textContent = spin.sound ? 'Sound on' : 'Sound off';
  this.setAttribute('aria-pressed', spin.sound ? 'true' : 'false');
});

window.addEventListener('pointermove', function(e){
  if (spin.active){
    if (spin.ended) return;
    var cx = window.innerWidth/2, cy = window.innerHeight/2;
    var dx = e.clientX - spin.px;

    // straight sideways flick - drag hard and it takes off
    spin.vel -= dx * (spin.held ? 0.62 : 0.20);

    // circling adds on top, so winding it up keeps working too
    var a = Math.atan2(e.clientY - cy, e.clientX - cx);
    if (spin.last !== null && Math.hypot(e.clientX-cx, e.clientY-cy) > 40){
      var d = a - spin.last;
      while (d >  Math.PI) d -= Math.PI*2;
      while (d < -Math.PI) d += Math.PI*2;
      spin.vel += d * 7.5;
    }
    spin.last = a;
    spin.px = e.clientX; spin.py = e.clientY;
    spin.lastInputAt = performance.now();
    spinStarted(spin.lastInputAt);
    return;
  }
  if (dragging){
    orbit.az -= (e.clientX - lastX) * 0.007;
    orbit.pol = Math.max(0.22, Math.min(2.55, orbit.pol - (e.clientY - lastY) * 0.006));
    lastX = e.clientX; lastY = e.clientY;
    placeCamera(); setHover(null);
    return;
  }
  mouse.x = (e.clientX/window.innerWidth)*2 - 1;
  mouse.y = -(e.clientY/window.innerHeight)*2 + 1;
  labelEl.style.left = e.clientX + 'px';
  labelEl.style.top = e.clientY + 'px';
});

/* ---------- loop ---------- */
var started = false, prev = performance.now();
function tick(now){
  requestAnimationFrame(tick);
  var dt = Math.min(0.05, (now - prev)/1000);
  prev = now;

  // ease the explode amount toward its target (the bike assembles for the spin)
  var want = spin.active ? 0 : explodeSlider.value/100;
  if (Math.abs(want - explodeT) > 0.002){
    explodeT += (want - explodeT) * Math.min(1, dt*6);
    applyExplode(explodeT);
    fitCamera();
  }

  if (spin.active){
    spin.vel = Math.max(-MAX_VEL, Math.min(MAX_VEL, spin.vel));
    orbit.az += spin.vel * dt;
    // a full turn of the bike is a point, whatever made it turn
    spin.azAccum += Math.abs(spin.vel) * dt;
    while (spin.azAccum >= Math.PI*2 && !spin.ended){
      spin.azAccum -= Math.PI*2;
      registerRotation();
    }
    spin.vel *= Math.pow(0.62, dt);
    placeCamera();

    if (!spin.ended){
      var left = spin.startAt === null ? SPIN_LIMIT : SPIN_LIMIT - (now - spin.startAt);
      if (left < 0) left = 0;
      clockEl.textContent = (left/1000).toFixed(1);
      if (left <= 5000) clockEl.classList.add('low'); else clockEl.classList.remove('low');

      // time's up wins over everything, even a held arrow key
      if (left === 0) endSpin();
      // or they let it coast to a stop on its own
      else if (spin.count > 0 && Math.abs(spin.vel) < 0.5 && now - spin.lastInputAt > 1100) endSpin();
    }
  } else {
    if (!dragging && !reduceMotion && now - idleAt > 3200){
      orbit.az += 0.0013;
      placeCamera();
    }
    if (!dragging && mouse.x > -5){
      ray.setFromCamera(mouse, camera);
      var hits = ray.intersectObjects(PARTS, true);
      if (hits.length){
        var o = hits[0].object;
        while (o && !o.userData.partName) o = o.parent;
        setHover(o || null);
      } else setHover(null);
    }
  }

  renderer.render(scene, camera);
  if (!started){ started = true; loading.style.display = 'none'; }
}
setMode('spin');
requestAnimationFrame(tick);

})();
</script>
</body>
