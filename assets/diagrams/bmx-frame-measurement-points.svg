<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <title>BMX Frame Measurement Points</title>
  <desc>Side view of a BMX frame highlighting Top Tube Length, Chainstay Length, Standover Height, and Wheelbase measurement lines.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .frame { stroke: #08090b; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .frame-thin { stroke: #08090b; stroke-width: 8; stroke-linecap: round; fill: none; }
      .ghost-wheel { stroke: #e2e5e9; stroke-width: 3; stroke-dasharray: 6 6; fill: none; }
      .dim-line { stroke: #e64700; stroke-width: 3; stroke-dasharray: 6 6; }
      .ground-line { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 4 4; }
      .text-label { fill: #e64700; font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; text-anchor: middle; }
      .text-sub { fill: #6b7280; font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#e64700" />
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e64700" />
    </marker>
  </defs>

  <rect class="bg" width="1000" height="620" />

  <!-- Ghosted Wheels & Ground Axis -->
  <line class="ground-line" x1="50" y1="520" x2="950" y2="520" />
  <circle class="ghost-wheel" cx="180" cy="380" r="140" />
  <circle class="ghost-wheel" cx="820" cy="380" r="140" />

  <!-- BMX Frame Skeleton (Ink) -->
  <!-- Head Tube -->
  <line class="frame" x1="780" y1="210" x2="800" y2="280" />
  <!-- Top Tube -->
  <line class="frame" x1="430" y1="250" x2="790" y2="230" />
  <!-- Down Tube -->
  <line class="frame" x1="480" y1="380" x2="795" y2="270" />
  <!-- Seat Tube -->
  <line class="frame" x1="480" y1="380" x2="415" y2="200" />
  <!-- Chainstays -->
  <line class="frame-thin" x1="480" y1="380" x2="180" y2="380" />
  <!-- Seatstays -->
  <line class="frame-thin" x1="425" y1="230" x2="180" y2="380" />
  <!-- Bottom Bracket Shell -->
  <circle fill="#08090b" cx="480" cy="380" r="14" />

  <!-- 1. TOP TUBE LENGTH -->
  <line class="dim-line" x1="423" y1="170" x2="790" y2="170" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  <line class="ground-line" x1="423" y1="230" x2="423" y2="150" />
  <line class="ground-line" x1="790" y1="230" x2="790" y2="150" />
  <rect class="bg" x="520" y="156" width="180" height="26" rx="4" />
  <text class="text-label" x="610" y="176">Top Tube Length</text>

  <!-- 2. CHAINSTAY LENGTH -->
  <line class="dim-line" x1="180" y1="420" x2="480" y2="420" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  <line class="ground-line" x1="180" y1="380" x2="180" y2="440" />
  <line class="ground-line" x1="480" y1="380" x2="480" y2="440" />
  <rect class="bg" x="240" y="406" width="180" height="26" rx="4" />
  <text class="text-label" x="330" y="426">Chainstay Length</text>

  <!-- 3. STANDOVER HEIGHT -->
  <line class="dim-line" x1="360" y1="240" x2="360" y2="520" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  <line class="ground-line" x1="360" y1="240" x2="425" y2="240" />
  <rect class="bg" x="280" y="360" width="160" height="26" rx="4" />
  <text class="text-label" x="360" y="380">Standover</text>

  <!-- 4. WHEELBASE -->
  <line class="dim-line" x1="180" y1="560" x2="820" y2="560" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  <line class="ground-line" x1="180" y1="380" x2="180" y2="580" />
  <line class="ground-line" x1="820" y1="380" x2="820" y2="580" />
  <rect class="bg" x="420" y="546" width="160" height="26" rx="4" />
  <text class="text-label" x="500" y="566">Wheelbase</text>
</svg>
