<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="ckt ckd"><title id="ckt">One, two and three piece cranks</title><desc id="ckd">Three cranksets drawn to the same scale with each separate piece in its own colour and numbered, so the number of pieces can be counted at a glance.</desc><defs><pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="16" height="16" fill="#ffffff"></rect><line x1="0" y1="0" x2="0" y2="16" stroke="#08090b" stroke-width="2"></line></pattern></defs><rect width="1000" height="600" fill="#ffffff"></rect><line x1="333" y1="40" x2="333" y2="560" stroke="#e2e5e9" stroke-width="2"></line><line x1="666" y1="40" x2="666" y2="560" stroke="#e2e5e9" stroke-width="2"></line><g><text x="26" y="66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#08090b" letter-spacing="1">One-piece</text><rect x="86" y="248" width="160" height="84" fill="url(#hatch)" stroke="#08090b" stroke-width="3"></rect><rect x="16" y="124" width="30" height="18" fill="#6b7280"></rect><rect x="286" y="438" width="30" height="18" fill="#6b7280"></rect><path d="M 16 140 h 30 v 136 h 270 v -0 v 0 L 316 276 v 164 h -30 v -136 h -270 Z" fill="#08090b"></path><circle cx="166" cy="94" r="22" fill="#ffffff" stroke="#08090b" stroke-width="3.5"></circle><text x="166" y="105" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#08090b" text-anchor="middle">1</text><text x="26" y="522" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="500" fill="#6b7280">Ashtabula,</text><text x="26" y="558" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="500" fill="#6b7280">one forging</text></g><g><text x="359" y="66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#08090b" letter-spacing="1">Two-piece</text><rect x="419" y="248" width="160" height="84" fill="url(#hatch)" stroke="#08090b" stroke-width="3"></rect><rect x="349" y="124" width="30" height="18" fill="#6b7280"></rect><rect x="619" y="438" width="30" height="18" fill="#6b7280"></rect><rect x="379" y="276" width="270" height="28" fill="#00a4e6"></rect><rect x="619" y="276" width="30" height="164" fill="#00a4e6"></rect><rect x="349" y="140" width="30" height="164" fill="#08090b"></rect><circle cx="364" cy="94" r="22" fill="#ffffff" stroke="#08090b" stroke-width="3.5"></circle><text x="364" y="105" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#08090b" text-anchor="middle">2</text><circle cx="634" cy="486" r="22" fill="#ffffff" stroke="#00a4e6" stroke-width="3.5"></circle><text x="634" y="497" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#00a4e6" text-anchor="middle">1</text><text x="359" y="522" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="500" fill="#6b7280">spindle fixed to</text><text x="359" y="558" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="500" fill="#6b7280">the drive arm</text></g><g><text x="692" y="66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#08090b" letter-spacing="1">Three-piece</text><rect x="752" y="248" width="160" height="84" fill="url(#hatch)" stroke="#08090b" stroke-width="3"></rect><rect x="682" y="124" width="30" height="18" fill="#6b7280"></rect><rect x="952" y="438" width="30" height="18" fill="#6b7280"></rect><rect x="712" y="276" width="240" height="28" fill="#00a4e6"></rect><rect x="682" y="140" width="30" height="164" fill="#08090b"></rect><rect x="952" y="276" width="30" height="164" fill="#e64700"></rect><circle cx="697" cy="94" r="22" fill="#ffffff" stroke="#08090b" stroke-width="3.5"></circle><text x="697" y="105" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#08090b" text-anchor="middle">1</text><circle cx="832" cy="366" r="22" fill="#ffffff" stroke="#00a4e6" stroke-width="3.5"></circle><text x="832" y="377" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#00a4e6" text-anchor="middle">2</text><circle cx="967" cy="486" r="22" fill="#ffffff" stroke="#e64700" stroke-width="3.5"></circle><text x="967" y="497" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#e64700" text-anchor="middle">3</text><text x="692" y="522" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="500" fill="#6b7280">two arms,</text><text x="692" y="558" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="500" fill="#6b7280">separate spindle</text></g></svg>