"></line><polygon points="410,600 425,592 425,608" fill="#e64700"></polygon><polygon points="445.6343577181948,600 430.6343577181948,592 430.6343577181948,608" fill="#e64700"></polygon><rect x="381.0171788590974" y="619.76" width="105.60000000000001" height="35.84" fill="#ffffff"></rect><text x="433.8171788590974" y="646" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#e64700" text-anchor="middle">Trail</text><line x1="420.0" y1="378.0" x2="512" y2="330" stroke="#6b7280" stroke-width="2"></line><rect x="512" y="313.76" width="123.52000000000001" height="35.84" fill="#ffffff"></rect><text x="520" y="340" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#e64700">Offset</text><text x="52" y="132" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#08090b">Steering axis</text><line x1="264" y1="124" x2="267.5" y2="176" stroke="#6b7280" stroke-width="2"></line><text x="52" y="644" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#08090b">Contact patch</text><line x1="264" y1="636" x2="400" y2="566" stroke="#6b7280" stroke-width="2"></line><circle cx="410" cy="560" r="8" fill="#08090b"></circle></svg>