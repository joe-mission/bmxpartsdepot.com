<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" width="760" height="720">
  <title>Fork Offset and Trail</title>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .fork { fill: #08090b; stroke: #08090b; stroke-width: 4; }
      .ghost-tire { stroke: #e2e5e9; stroke-width: 20; fill: none; }
      .steering-axis { stroke: #6b7280; stroke-width: 3; stroke-dasharray: 6 6; }
      .dim-orange { stroke: #e64700; stroke-width: 3.5; }
      .text-orange { fill: #e64700; font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 800; }
      .text-dark { fill: #08090b; font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 700; }
    </style>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#e64700" />
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e64700" />
    </marker>
  </defs>

  <rect class="bg" width="760" height="720" />

  <!-- Ground Line -->
  <line stroke="#08090b" stroke-width="4" x1="40" y1="620" x2="720" y2="620" />

  <!-- Ghosted Wheel/Tire -->
  <circle class="ghost-tire" cx="420" cy="420" r="200" />
  <circle fill="#08090b" cx="420" cy="420" r="14" />

  <!-- Fork Leg & Steerer (Ink) -->
  <path class="fork" d="M 220 80 L 260 80 L 370 420 L 420 420 L 420 440 L 350 440 Z" />

  <!-- Extended Steering Axis Dashed Line -->
  <line class="steering-axis" x1="200" y1="20" x2="500" y2="620" />
  <text class="text-dark" x="120" y="50">Steering Axis</text>

  <!-- Tyre Contact Patch Point -->
  <circle fill="#e64700" cx="420" cy="620" r="8" />
  <text class="text-dark" x="440" y="660">Contact Patch</text>

  <!-- 1. OFFSET (Perpendicular Axis to Axle) -->
  <line class="dim-orange" x1="355" y1="420" x2="420" y2="420" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  <text class="text-orange" x="340" y="390">Offset</text>

  <!-- 2. TRAIL (Ground Axis Landing to Contact Patch) -->
  <line class="dim-orange" x1="500" y1="620" x2="420" y2="620" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  <text class="text-orange" x="445" y="590">Trail</text>
</svg>
