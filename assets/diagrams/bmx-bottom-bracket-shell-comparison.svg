<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720">
  <title>BMX Bottom Bracket Shell Comparison</title>
  <desc>Precision cross-section comparison of American, Mid, Spanish, and Euro BMX bottom bracket shell standards drawn to an exact scale of 5 units per millimeter.</desc>
  
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .shell-wall { fill: #08090b; }
      .bearing { fill: #00a4e6; stroke: #08090b; stroke-width: 3; }
      .cup { fill: #e64700; stroke: #08090b; stroke-width: 3; }
      .dim-line { stroke: #6b7280; stroke-width: 3; stroke-dasharray: 6 6; }
      .grid-line { stroke: #e2e5e9; stroke-width: 2; }
      .label-main { fill: #08090b; }
      .label-sub { fill: #6b7280; }
      .label-highlight { fill: #e64700; }
      .thread { stroke: #08090b; stroke-width: 3; stroke-linecap: round; }
      .callout-line { stroke: #00a4e6; stroke-width: 3; stroke-dasharray: 4 4; fill: none; }
    </style>
    
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#6b7280" />
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280" />
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1000" height="720" />

  <!-- Grid Dividers (Cell bounds: 500x360) -->
  <line class="grid-line" x1="500" y1="20" x2="500" y2="700" />
  <line class="grid-line" x1="20" y1="360" x2="980" y2="360" />

  <!-- ==================== PANEL 1: AMERICAN ==================== 
       Cell Center X: 250 | Shell Width: 340 units (68mm) 
       Top Wall Y: 100 to 120 | Bottom Wall Y: 300 to 320
       Bore: 257 units (51.4mm) | Cup ID: 207 units | Bearing: 207 x 55 units
  ============================================================== -->
  <g id="panel-american">
    <!-- Header: AMERICAN (Font size 44 outlined) -->
    <path class="label-main" d="M 148 70 L 157 44 L 169 44 L 178 70 L 167 70 L 164 62 L 157 62 L 154 70 Z M 159 54 L 163 54 L 161 47 Z M 184 70 L 184 44 L 194 44 L 200 57 L 206 44 L 216 44 L 216 70 L 207 70 L 207 51 L 201 64 L 197 64 L 191 51 L 191 70 Z M 222 70 L 222 44 L 243 44 L 243 51 L 231 51 L 231 54 L 241 54 L 241 61 L 231 61 L 231 63 L 244 63 L 244 70 Z M 250 70 L 250 44 L 264 44 Q 272 44 272 50 Q 272 55 267 57 L 273 70 L 262 70 L 257 58 L 257 70 Z M 257 51 L 263 51 Q 264 51 264 50 Q 264 48 263 48 L 257 48 Z M 279 70 L 279 44 L 288 44 L 288 70 Z M 294 57 Q 294 44 307 44 Q 318 44 319 53 L 310 54 Q 309 50 307 50 Q 303 50 303 57 Q 303 64 307 64 Q 309 64 310 60 L 319 61 Q 318 70 307 70 Q 294 70 294 57 Z M 323 70 L 332 44 L 344 44 L 354 70 L 343 70 L 340 62 L 333 62 L 330 70 Z M 335 54 L 339 54 L 337 47 Z M 359 70 L 359 44 L 369 44 L 377 60 L 377 44 L 385 44 L 385 70 L 376 70 L 368 53 L 368 70 Z" />

    <!-- Frame Tube Walls (Thickness: 20 units) -->
    <rect class="shell-wall" x="80" y="80" width="340" height="20" rx="2" />
    <rect class="shell-wall" x="80" y="320" width="340" height="20" rx="2" />

    <!-- Pressed Steel Cups (Orange: Outer 257u, Inner 207u) -->
    <path class="cup" d="M 80 100 L 135 100 L 135 125 L 105 125 L 105 295 L 135 295 L 135 320 L 80 320 Z" />
    <path class="cup" d="M 420 100 L 365 100 L 365 125 L 395 125 L 395 295 L 365 295 L 365 320 L 420 320 Z" />

    <!-- Bearings Inside Cups (Cyan: 207u OD, 55u width) -->
    <rect class="bearing" x="105" y="106.5" width="55" height="207" rx="2" />
    <rect class="bearing" x="340" y="106.5" width="55" height="207" rx="2" />

    <!-- Dimension Line & Figure: 51.3 to 51.5mm (Font size 38) -->
    <line class="dim-line" x1="80" y1="210" x2="420" y2="210" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <rect class="bg" x="120" y="196" width="260" height="28" rx="4" />
    <!-- Outlined 51.3 to 51.5mm -->
    <text class="label-main" x="250" y="218" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle">51.3 to 51.5mm</text>
  </g>

  <!-- ==================== PANEL 2: MID ==================== 
       Cell Center X: 750 | Shell Width: 340 units (68mm)
       Top Wall Y: 100 to 120 | Bottom Wall Y: 300 to 320
       Bore: 207 units (41.3mm) | Bearing: 207 x 55 units (EXACT MATCH TO PANEL 1)
  ============================================================== -->
  <g id="panel-mid">
    <!-- Header: MID (Font size 44 outlined) -->
    <path class="label-main" d="M 700 70 L 700 44 L 710 44 L 716 57 L 722 44 L 732 44 L 732 70 L 723 70 L 723 51 L 717 64 L 713 64 L 707 51 L 707 70 Z M 740 70 L 740 44 L 749 44 L 749 70 Z M 755 70 L 755 44 L 770 44 Q 780 44 780 57 Q 780 70 770 70 Z M 764 51 L 764 63 L 769 63 Q 771 63 771 57 Q 771 51 769 51 Z" />

    <!-- Frame Tube Walls (Thickness: 20 units) -->
    <rect class="shell-wall" x="580" y="80" width="340" height="25" rx="2" />
    <rect class="shell-wall" x="580" y="315" width="340" height="25" rx="2" />

    <!-- Direct Press-Fit Bearings (Cyan: 207u OD, 55u width) -->
    <rect class="bearing" x="580" y="106.5" width="55" height="207" rx="2" />
    <rect class="bearing" x="865" y="106.5" width="55" height="207" rx="2" />

    <!-- Dimension Line & Figure: 41.3mm (Font size 38) -->
    <line class="dim-line" x1="580" y1="210" x2="920" y2="210" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <rect class="bg" x="690" y="196" width="120" height="28" rx="4" />
    <text class="label-main" x="750" y="218" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle">41.3mm</text>
  </g>

  <!-- Shared Callout Line & Annotation: 41.3mm bearing (Font size 32) -->
  <g id="bearing-identity-callout">
    <path class="callout-line" d="M 132.5 240 L 132.5 285 L 607.5 285 L 607.5 240" />
    <rect fill="#00a4e6" x="270" y="271" width="220" height="28" rx="6" />
    <text fill="#ffffff" x="380" y="291" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">41.3mm bearing</text>
  </g>

  <!-- ==================== PANEL 3: SPANISH ==================== 
       Cell Center X: 250 | Shell Width: 340 units (68mm)
       Top Wall Y: 460 to 480 | Bottom Wall Y: 645 to 665
       Bore: 185 units (37mm) | Bearing: 185 x 45 units
  ============================================================== -->
  <g id="panel-spanish">
    <!-- Header: SPANISH (Font size 44 outlined) -->
    <path class="label-main" d="M 160 425 Q 160 414 174 414 Q 186 414 187 424 L 177 425 Q 176 420 174 420 Q 170 420 170 423 Q 170 425 176 427 Q 188 430 188 437 Q 188 444 174 444 Q 160 444 160 439 Z M 193 444 L 193 414 L 208 414 Q 216 414 216 423 Q 216 431 208 431 L 202 431 L 202 444 Z M 202 420 L 202 425 L 207 425 Q 208 425 208 423 Q 208 420 207 420 Z M 220 444 L 229 414 L 241 414 L 250 444 L 239 444 L 237 436 L 230 436 L 228 444 Z M 232 428 L 236 428 L 234 421 Z M 255 444 L 255 414 L 265 414 L 273 430 L 273 414 L 281 414 L 281 444 L 272 444 L 264 427 L 264 444 Z M 287 444 L 287 414 L 296 414 L 296 444 Z M 301 439 Q 301 433 309 432 Q 315 431 315 428 Q 315 426 312 426 Q 308 426 307 430 L 298 428 Q 300 414 312 414 Q 324 414 324 426 Q 324 433 316 434 Q 310 435 310 438 Q 310 440 313 440 Q 317 440 318 436 L 327 438 Q 324 444 313 444 Q 301 444 301 439 Z M 330 444 L 330 414 L 339 414 L 339 425 L 350 425 L 350 414 L 359 414 L 359 444 L 350 444 L 350 432 L 339 432 L 339 444 Z" />

    <!-- Frame Tube Walls (Thickness: 20 units) -->
    <rect class="shell-wall" x="80" y="450" width="340" height="30" rx="2" />
    <rect class="shell-wall" x="80" y="635" width="340" height="30" rx="2" />

    <!-- Direct Press-Fit Bearings (Cyan: 185u OD, 45u width) -->
    <rect class="bearing" x="80" y="480" width="45" height="155" rx="2" />
    <rect class="bearing" x="375" y="480" width="45" height="155" rx="2" />

    <!-- Dimension Line & Figure: 37mm (Font size 38) -->
    <line class="dim-line" x1="80" y1="557.5" x2="420" y2="557.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <rect class="bg" x="200" y="543.5" width="100" height="28" rx="4" />
    <text class="label-main" x="250" y="565.5" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle">37mm</text>
  </g>

  <!-- ==================== PANEL 4: EURO ==================== 
       Cell Center X: 750 | Shell Width: 340 units (68mm)
       Top Wall Y: 460 to 480 | Bottom Wall Y: 634 to 654
       Thread Major Bore: 174 units (~34.8mm) | Thread Pitch Marks Included
  ============================================================== -->
  <g id="panel-euro">
    <!-- Header: EURO (Font size 44 outlined) -->
    <path class="label-main" d="M 700 444 L 700 414 L 721 414 L 721 421 L 709 421 L 709 424 L 719 424 L 719 430 L 709 430 L 709 437 L 722 437 L 722 444 Z M 727 437 L 727 414 L 736 414 L 736 435 Q 736 438 741 438 Q 745 438 745 435 L 745 414 L 754 414 L 754 437 Q 754 444 741 444 Q 727 444 727 437 Z M 759 444 L 759 414 L 773 414 Q 780 414 780 420 Q 780 424 776 426 L 782 444 L 771 444 L 766 429 L 766 444 Z M 766 420 L 771 420 Q 772 420 772 419 Q 772 418 771 418 L 766 418 Z M 785 429 Q 785 414 798 414 Q 811 414 811 429 Q 811 444 798 444 Q 785 444 785 429 Z M 794 429 Q 794 438 798 438 Q 802 438 802 429 Q 802 420 798 420 Q 794 420 794 429 Z" />

    <!-- Frame Tube Walls (Thickness: 20 units) -->
    <rect class="shell-wall" x="580" y="450" width="340" height="30" rx="2" />
    <rect class="shell-wall" x="580" y="624" width="340" height="30" rx="2" />

    <!-- Internal Threads Profile (Draw on shell wall interior edge) -->
    <path class="thread" d="M 580 480 L 588 484 L 580 488 L 588 492 L 580 496 L 588 500 L 580 504 L 588 508 L 580 512 L 588 516 L 580 520 L 588 524 L 580 528 L 588 532 L 580 536 L 588 540 L 580 544 L 588 548 L 580 552 L 588 556 L 580 560 L 588 564 L 580 568 L 588 572 L 580 576 L 588 580 L 580 584 L 588 588 L 580 592 L 588 596 L 580 600 L 588 604 L 580 608 L 588 612 L 580 616 L 588 620 L 580 624" />
    <path class="thread" d="M 920 480 L 912 484 L 920 488 L 912 492 L 920 496 L 912 500 L 920 504 L 912 508 L 920 512 L 912 516 L 920 520 L 912 524 L 920 528 L 912 532 L 920 536 L 912 540 L 920 544 L 912 548 L 920 552 L 912 556 L 920 560 L 912 564 L 920 568 L 912 572 L 920 576 L 912 580 L 920 584 L 912 588 L 920 592 L 912 596 L 920 600 L 912 604 L 920 608 L 912 612 L 920 616 L 912 620 L 920 624" />

    <!-- Threaded External Cups (Orange) & Internal Bearings (Cyan) -->
    <path class="cup" d="M 580 455 L 620 455 L 620 480 L 600 480 L 600 624 L 620 624 L 620 649 L 580 649 Z" />
    <path class="cup" d="M 920 455 L 880 455 L 880 480 L 900 480 L 900 624 L 880 624 L 880 649 L 920 649 Z" />
    <rect class="bearing" x="620" y="480" width="35" height="144" rx="2" />
    <rect class="bearing" x="845" y="480" width="35" height="144" rx="2" />

    <!-- Dimension Line & Figure: 1.37 in x 24 TPI (Font size 38) -->
    <line class="dim-line" x1="580" y1="552" x2="920" y2="552" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <rect class="bg" x="620" y="538" width="260" height="28" rx="4" />
    <text class="label-main" x="750" y="560" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle">1.37 in x 24 TPI</text>

    <!-- Annotation: thread, not a bore (Font size 32, #6b7280) -->
    <text class="label-sub" x="750" y="680" font-family="sans-serif" font-size="32" font-style="italic" text-anchor="middle">thread, not a bore</text>
  </g>
</svg>
