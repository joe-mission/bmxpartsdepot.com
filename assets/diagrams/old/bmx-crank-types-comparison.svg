<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460">
  <title>One, Two and Three-Piece Cranks Compared</title>
  <desc>Countable piece comparison between 1-piece Ashtabula forgings, 2-piece fixed spindle cranks, and 3-piece dual arm cranks.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .part-one { fill: #08090b; stroke: #08090b; stroke-width: 2; }
      .part-two { fill: #00a4e6; stroke: #08090b; stroke-width: 2; }
      .part-three { fill: #e64700; stroke: #08090b; stroke-width: 2; }
      .grid-line { stroke: #e2e5e9; stroke-width: 2; }
      .text-title { fill: #08090b; font-family: system-ui, -apple-system, sans-serif; font-size: 30px; font-weight: 800; text-anchor: middle; }
      .text-sub { fill: #6b7280; font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 500; text-anchor: middle; }
      .badge { fill: #08090b; }
      .badge-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="460" />
  <line class="grid-line" x1="333" y1="20" x2="333" y2="440" />
  <line class="grid-line" x1="666" y1="20" x2="666" y2="440" />

  <!-- PANEL 1: ONE-PIECE -->
  <g id="one-piece">
    <text class="text-title" x="166.5" y="55">ONE-PIECE</text>
    <text class="text-sub" x="166.5" y="85">Ashtabula, one forging</text>

    <!-- Continuous S-Forging (Ink) -->
    <path class="part-one" d="M 80 140 L 140 140 L 140 250 L 190 250 L 190 340 L 250 340 L 250 310 L 215 310 L 215 225 L 165 225 L 165 110 L 80 110 Z" />

    <!-- 1 Count Badge -->
    <circle class="badge" cx="166.5" cy="235" r="22" />
    <text class="badge-text" x="166.5" y="243">1</text>
  </g>

  <!-- PANEL 2: TWO-PIECE -->
  <g id="two-piece">
    <text class="text-title" x="500" y="55">TWO-PIECE</text>
    <text class="text-sub" x="500" y="85">spindle fixed to drive arm</text>

    <!-- Piece 1: Arm + Welded Spindle Unit (Cyan) -->
    <rect class="part-two" x="420" y="220" width="120" height="28" rx="4" />
    <rect class="part-two" x="510" y="130" width="35" height="180" rx="6" />

    <!-- Piece 2: Non-Drive Pinch Arm (Ink) -->
    <rect class="part-one" x="430" y="130" width="35" height="180" rx="6" />

    <!-- Count Badges -->
    <circle class="badge" cx="447.5" cy="220" r="18" />
    <text class="badge-text" x="447.5" y="227">1</text>

    <circle fill="#00a4e6" cx="527.5" cy="220" r="18" stroke="#08090b" stroke-width="2" />
    <text class="badge-text" x="527.5" y="227">2</text>
  </g>

  <!-- PANEL 3: THREE-PIECE -->
  <g id="three-piece">
    <text class="text-title" x="833" y="55">THREE-PIECE</text>
    <text class="text-sub" x="833" y="85">two arms, separate spindle</text>

    <!-- Piece 1: Left Arm (Ink) -->
    <rect class="part-one" x="750" y="130" width="35" height="180" rx="6" />

    <!-- Piece 2: Independent Spindle (Orange) -->
    <rect class="part-three" x="770" y="220" width="120" height="28" rx="4" />

    <!-- Piece 3: Right Arm (Cyan) -->
    <rect class="part-two" x="875" y="130" width="35" height="180" rx="6" />

    <!-- Count Badges -->
    <circle class="badge" cx="767.5" cy="220" r="18" />
    <text class="badge-text" x="767.5" y="227">1</text>

    <circle fill="#e64700" cx="830" cy="220" r="18" stroke="#08090b" stroke-width="2" />
    <text class="badge-text" x="830" y="227">2</text>

    <circle fill="#00a4e6" cx="892.5" cy="220" r="18" stroke="#08090b" stroke-width="2" />
    <text class="badge-text" x="892.5" y="227">3</text>
  </g>
</svg>
