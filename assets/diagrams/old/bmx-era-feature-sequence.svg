<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <title>Era Feature Sequence</title>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .era-zone { fill: #f8fafc; stroke: #e2e5e9; stroke-dasharray: 4 4; }
      .text-era { fill: #6b7280; font-family: system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; text-anchor: middle; }
      .text-row { fill: #08090b; font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; }
      .chip { fill: #08090b; rx: 6px; }
      .chip-mid { fill: #00a4e6; rx: 6px; }
      .chip-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="520" />

  <!-- VAGUE ERA FLOATING ZONES -->
  <rect class="era-zone" x="180" y="20" width="240" height="50" rx="6" />
  <text class="text-era" x="300" y="55">OLD SCHOOL</text>

  <rect class="era-zone" x="440" y="20" width="240" height="50" rx="6" />
  <text class="text-era" x="560" y="55">MID SCHOOL</text>

  <rect class="era-zone" x="700" y="20" width="240" height="50" rx="6" />
  <text class="text-era" x="820" y="55">MODERN</text>

  <!-- ROW 1: BOTTOM BRACKET -->
  <text class="text-row" x="20" y="125">BB Shell</text>
  <rect class="chip" x="180" y="100" width="220" height="40" />
  <text class="chip-text" x="290" y="126">American</text>

  <rect class="chip-mid" x="420" y="100" width="340" height="40" />
  <text class="chip-text" x="590" y="126">Euro → Mid → Spanish</text>

  <rect class="chip" x="780" y="100" width="160" height="40" />
  <text class="chip-text" x="860" y="126">Mid</text>

  <!-- ROW 2: HEADSET -->
  <text class="text-row" x="20" y="205">Headset</text>
  <rect class="chip" x="180" y="180" width="260" height="40" />
  <text class="chip-text" x="310" y="206">1" Threaded</text>

  <rect class="chip-mid" x="460" y="180" width="240" height="40" />
  <text class="chip-text" x="580" y="206">1-1/8" Threadless</text>

  <rect class="chip" x="720" y="180" width="220" height="40" />
  <text class="chip-text" x="830" y="206">Integrated</text>

  <!-- ROW 3: CRANKS -->
  <text class="text-row" x="20" y="285">Cranks</text>
  <rect class="chip" x="180" y="260" width="200" height="40" />
  <text class="chip-text" x="280" y="286">One-Piece</text>

  <rect class="chip-mid" x="400" y="260" width="320" height="40" />
  <text class="chip-text" x="560" y="286">Three-Piece</text>

  <rect class="chip" x="740" y="260" width="200" height="40" />
  <text class="chip-text" x="840" y="286">Two / Three-Piece</text>

  <!-- ROW 4: BRAKES -->
  <text class="text-row" x="20" y="365">Brakes</text>
  <rect class="chip" x="180" y="340" width="240" height="40" />
  <text class="chip-text" x="300" y="366">Caliper / Early U-Brake</text>

  <rect class="chip-mid" x="440" y="340" width="280" height="40" />
  <text class="chip-text" x="580" y="366">U-Brake &amp; Gyro</text>

  <rect class="chip" x="740" y="340" width="200" height="40" />
  <text class="chip-text" x="840" y="366">Removable / Brakeless</text>
</svg>
