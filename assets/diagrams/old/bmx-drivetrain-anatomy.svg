<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <title>BMX Drivetrain Anatomy</title>
  <desc>Side elevation view of sprocket, chain, and driver paired with a top-down view illustrating ideal chainline alignment.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .sprocket { fill: #08090b; stroke: #08090b; stroke-width: 2; }
      .driver { fill: #00a4e6; stroke: #08090b; stroke-width: 2; }
      .chain { fill: none; stroke: #08090b; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .chain-inner { fill: none; stroke: #ffffff; stroke-width: 4; stroke-dasharray: 8 6; }
      .grid-line { stroke: #e2e5e9; stroke-width: 2; }
      .chainline { stroke: #e64700; stroke-width: 3; stroke-dasharray: 6 6; }
      .faint-sprocket { fill: #e2e5e9; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .text-title { fill: #08090b; font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 800; text-anchor: middle; }
      .text-sub { fill: #6b7280; font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 500; text-anchor: middle; }
      .text-highlight { fill: #e64700; font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .callout-line { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="560" />
  <line class="grid-line" x1="40" y1="360" x2="960" y2="360" />

  <!-- TOP TWO-THIRDS: SIDE VIEW -->
  <g id="side-view">
    <!-- Chain Loop -->
    <path class="chain" d="M 280 110 L 750 160 A 40 40 0 0 1 750 240 L 280 290 A 90 90 0 0 1 280 110 Z" />
    <path class="chain-inner" d="M 280 110 L 750 160 A 40 40 0 0 1 750 240 L 280 290 A 90 90 0 0 1 280 110 Z" />

    <!-- Front Sprocket (Ink) -->
    <circle class="sprocket" cx="280" cy="200" r="90" />
    <circle fill="#ffffff" cx="280" cy="200" r="30" />

    <!-- Rear Driver (Cyan) -->
    <circle class="driver" cx="750" cy="200" r="40" />
    <circle fill="#ffffff" cx="750" cy="200" r="14" />

    <!-- Callout Labels -->
    <line class="callout-line" x1="280" y1="110" x2="280" y2="50" />
    <text class="text-title" x="280" y="40">Sprocket</text>

    <line class="callout-line" x1="515" y1="135" x2="515" y2="50" />
    <text class="text-title" x="515" y="40">Chain</text>

    <line class="callout-line" x1="750" y1="160" x2="750" y2="50" />
    <text class="text-title" x="750" y="40">Driver</text>
  </g>

  <!-- BOTTOM THIRD: TOP-DOWN CHAINLINE VIEW -->
  <g id="top-view" transform="translate(0, 360)">
    <text class="text-sub" x="120" y="110">TOP-DOWN VIEW</text>

    <!-- Front Axle/BB Spindle -->
    <line stroke="#6b7280" stroke-width="6" x1="280" y1="40" x2="280" y2="160" />
    <!-- Rear Axle -->
    <line stroke="#6b7280" stroke-width="6" x1="750" y1="40" x2="750" y2="160" />

    <!-- Ideal Straight Chainline (Orange Dashed) -->
    <line class="chainline" x1="280" y1="60" x2="750" y2="60" />

    <!-- Front Sprocket in Section -->
    <rect fill="#08090b" x="274" y="52" width="12" height="16" rx="2" />
    <!-- Rear Driver Cog in Section -->
    <rect fill="#00a4e6" stroke="#08090b" stroke-width="1.5" x="744" y="52" width="12" height="16" rx="2" />

    <!-- Faint Out-of-Line Misaligned Sprocket Example -->
    <rect class="faint-sprocket" x="274" y="92" width="12" height="16" rx="2" />
    <line stroke="#e2e5e9" stroke-width="2" stroke-dasharray="4 4" x1="280" y1="100" x2="750" y2="60" />

    <!-- Labels -->
    <text class="text-highlight" x="515" y="50">Straight Chainline</text>
    <text class="text-sub" x="480" y="115">Offset misaligns chain</text>
  </g>
</svg>
