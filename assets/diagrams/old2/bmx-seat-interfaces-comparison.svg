<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="sit sid"><title id="sit">How the seat meets the post</title><desc id="sid">Three cross sections comparing pivotal, railed and tripod seat interfaces, with the bolts drawn so the count and direction can be read at a glance.</desc><defs><pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="16" height="16" fill="#ffffff"></rect><line x1="0" y1="0" x2="0" y2="16" stroke="#08090b" stroke-width="2"></line></pattern></defs><rect width="1000" height="600" fill="#ffffff"></rect><line x1="333" y1="40" x2="333" y2="560" stroke="#e2e5e9" stroke-width="2"></line><line x1="666" y1="40" x2="666" y2="560" stroke="#e2e5e9" stroke-width="2"></line><g><text x="26" y="66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#08090b" letter-spacing="1">Pivotal</text><rect x="128" y="330" width="76" height="130" fill="url(#hatch)" stroke="#08090b" stroke-width="3"></rect><path d="M 108 330 L 126 262 L 206 262 L 224 330 Z" fill="url(#hatch)" stroke="#08090b" stroke-width="3"></path><path d="M 122 262 l 8 -12 l 8 12 Z" fill="#08090b"></path><path d="M 144 262 l 8 -12 l 8 12 Z" fill="#08090b"></path><path d="M 166 262 l 8 -12 l 8 12 Z" fill="#08090b"></path><path d="M 188 262 l 8 -12 l 8 12 Z" fill="#08090b"></path><path d="M 210 262 l 8 -12 l 8 12 Z" fill="#08090b"></path><path d="M 46 250 L 286 250 L 286 214 Q 166 194 46 214 Z" fill="#00a4e6"></path><rect x="153" y="204" width="26" height="126" fill="#e64700"></rect><rect x="136" y="176" width="60" height="30" rx="4" fill="#e64700"></rect><text x="26" y="504" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="500" fill="#6b7280">one bolt down</text><text x="26" y="538" font-family="system-ui, -apple-system, BlinkMacSyste