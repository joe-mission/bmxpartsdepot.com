 height="42" fill="url(#hatch)" stroke="#08090b" stroke-width="3"></rect><path d="M 712 250 L 952 250 L 952 216 Q 832 196 712 216 Z" fill="#00a4e6"></path><rect x="757" y="234" width="22" height="102" fill="#e64700"></rect><rect x="746" y="214" width="44" height="24" rx="4" fill="#e64700"></rect><rect x="821" y="234" width="22" height="102" fill="#e64700"></rect><rect x="810" y="214" width="44" height="24" rx="4" fill="#e64700"></rect><rect x="885" y="234" width="22" height="102" fill="#e64700"></rect><rect x="874" y="214" width="44" height="24" rx="4" fill="#e64700"></rect><text x="692" y="504" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="500" fill="#6b7280">three-point</text><text x="692" y="538" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="500" fill="#6b7280">mounting plate</text></g></svg>