<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <title>The Four Bar Measurements</title>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .bar { fill: none; stroke: #08090b; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
      .dim-orange { stroke: #e64700; stroke-width: 3; stroke-dasharray: 6 6; }
      .grid-line { stroke: #e2e5e9; stroke-width: 2; }
      .text-orange { fill: #e64700; font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 800; text-anchor: middle; }
      .text-dark { fill: #08090b; font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 700; }
    </style>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#e64700" />
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e64700" />
    </marker>
  </defs>

  <rect class="bg" width="1000" height="600" />

  <!-- MAIN FRONT VIEW -->
  <g id="front-view">
    <!-- Handlebar Tube (Ink) -->
    <path class="bar" d="M 100 160 L 280 160 L 320 380 L 480 380 L 520 160 L 700 160" />
    <!-- Crossbar -->
    <line stroke="#08090b" stroke-width="12" x1="300" y1="260" x2="500" y2="260" />

    <!-- RISE (Clamp Center to Top of Tube) -->
    <line class="dim-orange" x1="400" y1="380" x2="400" y2="150" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <rect class="bg" x="360" y="240" width="80" height="30" rx="4" />
    <text class="text-orange" x="400" y="262">Rise</text>

    <!-- WIDTH (Tip to Tip) -->
    <line class="dim-orange" x1="100" y1="100" x2="700" y2="100" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <rect class="bg" x="360" y="85" width="80" height="30" rx="4" />
    <text class="text-orange" x="400" y="107">Width</text>
  </g>

  <!-- INSET TOP-DOWN VIEW (Lower Right) -->
  <g id="top-inset" transform="translate(680, 360)">
    <rect fill="#f8fafc" stroke="#e2e5e9" stroke-width="2" x="0" y="0" width="280" height="200" rx="8" />
    <text class="text-dark" x="20" y="35">TOP INSET</text>

    <!-- Swept Tube Profile -->
    <path stroke="#08090b" stroke-width="10" fill="none" d="M 30 140 L 100 140 L 130 90 L 250 70" />
    <line stroke="#6b7280" stroke-width="2" stroke-dasharray="4 4" x1="100" y1="140" x2="260" y2="140" />

    <!-- Angles -->
    <path stroke="#e64700" stroke-width="3" fill="none" d="M 180 140 A 60 60 0 0 1 170 80" />
    <text class="text-orange" x="200" y="120">Backsweep / Upsweep</text>
  </g>
</svg>
