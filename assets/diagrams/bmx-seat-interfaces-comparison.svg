<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <title>The Three Seat Interfaces</title>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .post { fill: #08090b; stroke: #08090b; stroke-width: 2; }
      .seat-base { fill: #00a4e6; stroke: #08090b; stroke-width: 2; }
      .bolt { fill: #e64700; stroke: #08090b; stroke-width: 2; }
      .grid-line { stroke: #e2e5e9; stroke-width: 2; }
      .text-title { fill: #08090b; font-family: system-ui, -apple-system, sans-serif; font-size: 30px; font-weight: 800; text-anchor: middle; }
      .text-sub { fill: #6b7280; font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 500; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="480" />
  <line class="grid-line" x1="333" y1="20" x2="333" y2="440" />
  <line class="grid-line" x1="666" y1="20" x2="666" y2="440" />

  <!-- PANEL 1: PIVOTAL -->
  <g id="pivotal">
    <text class="text-title" x="166.5" y="55">PIVOTAL</text>

    <!-- Seat Base (Cyan) -->
    <path class="seat-base" d="M 60 180 Q 166 140 270 180 L 250 210 Q 166 180 80 210 Z" />
    <!-- Splined Post Top (Ink) -->
    <rect class="post" x="145" y="210" width="43" height="180" rx="4" />
    <circle cx="166.5" cy="210" r="22" fill="#08090b" />

    <!-- Single Top-Down Bolt (Orange) -->
    <rect class="bolt" x="158" y="150" width="17" height="70" rx="3" />

    <text class="text-sub" x="166.5" y="430">1 bolt down through seat</text>
  </g>

  <!-- PANEL 2: RAILED -->
  <g id="railed">
    <text class="text-title" x="500" y="55">RAILED</text>

    <!-- Two Rails (Cyan) -->
    <circle fill="#00a4e6" stroke="#08090b" stroke-width="3" cx="470" cy="200" r="12" />
    <circle fill="#00a4e6" stroke="#08090b" stroke-width="3" cx="530" cy="200" r="12" />

    <!-- Two-Part Clamping Head (Ink) -->
    <rect class="post" x="440" y="175" width="120" height="15" rx="3" />
    <rect class="post" x="440" y="215" width="120" height="20" rx="3" />
    <rect class="post" x="480" y="235" width="40" height="155" rx="4" />

    <!-- Clamping Bolts (Orange) -->
    <rect class="bolt" x="491" y="210" width="18" height="45" rx="2" />

    <text class="text-sub" x="500" y="430">2 rails clamped in head</text>
  </g>

  <!-- PANEL 3: TRIPOD -->
  <g id="tripod">
    <text class="text-title" x="833" y="55">TRIPOD</text>

    <!-- Seat Base (Cyan) -->
    <path class="seat-base" d="M 730 180 Q 833 150 936 180 L 910 210 Q 833 190 756 210 Z" />

    <!-- 3-Point Wedge Plate Post (Ink) -->
    <polygon class="post" points="770,210 896,210 853,240 813,240" />
    <rect class="post" x="813" y="240" width="40" height="150" rx="4" />

    <!-- Single Underneath Bolt (Orange) -->
    <rect class="bolt" x="824" y="230" width="18" height="40" rx="2" />

    <text class="text-sub" x="833" y="430">3-point mounting plate</text>
  </g>
</svg>
